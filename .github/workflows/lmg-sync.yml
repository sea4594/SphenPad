name: Sync LMG Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "37 1,7,13,19 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sphenpad-archive-cache-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: LMG index tests
        run: npm run test-lmg-catalog
      - name: Sync LMG cache
        run: npm run sync-lmg-cache
      - name: Commit changed LMG catalog and payloads
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/lmg reports/lmg-catalog-audit.json
          if git diff --cached --quiet; then
            echo "LMG cache unchanged."
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: refresh LMG playable puzzle cache"
          # No force push. A concurrent remote update is integrated normally.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Build production app with latest hosted LMG data
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
